<script>
      function drawButton(canvasId, title, width) {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, width, 170);
        ctx.fillStyle = "rgba(18, 20, 29, 0.95)";
        ctx.roundRect(10, 10, width - 20, 150, 28);
        ctx.fill();
        ctx.lineWidth = 5;
        ctx.strokeStyle = "#FFD700";
        ctx.stroke();
        ctx.fillStyle = "#FFFFFF";
        ctx.font = "bold 44px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(title + " ➔", width / 2, 85);
      }

      window.addEventListener('load', () => {
        drawButton('btn-europe', 'Europe', 600);
        drawButton('btn-north-america', 'North America', 760);
        drawButton('btn-south-america', 'South America', 760);
        drawButton('btn-africa', 'Africa & Gulf', 700);
        drawButton('btn-asia', 'Asia & Oceania', 780);
      });

      const data = {
        europe: {
          title: "Europe",
          countries: [
            { name: "Italy", flag: "🇮🇹", url: "https://disk.yandex.ru/d/85Pdg0fvxir31A" },
            { name: "Sardinia", icon: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Flag_of_Sardinia.svg/60px-Flag_of_Sardinia.svg.png", url: "https://disk.yandex.ru/d/i8U8ojtllbuH4g" },
            { name: "Croatia", flag: "🇭🇷", url: "https://disk.yandex.ru/d/sIWYC7LTMAIDPw" },
            { name: "Spain", flag: "🇪🇸", url: "https://disk.yandex.ru/d/GKAKTY1uNk6ARA" },
            { name: "Portugal", flag: "🇵🇹", url: "https://disk.yandex.ru/d/CDl2SXTKuhkx-Q" },
            { name: "Germany", flag: "🇩🇪", url: "https://disk.yandex.ru/d/krPEvjvqsnLr3g" },
            { name: "Poland", flag: "🇵🇱", url: "https://disk.yandex.ru/d/ph81vLLacGXnUQ" },
            { name: "Denmark", flag: "🇩🇰", url: "https://disk.yandex.ru/d/J5T9HQRTQMF-aw" },
            { name: "Sweden", flag: "🇸🇪", url: "https://disk.yandex.ru/d/iHJKhJQKxd97Ew" },
            { name: "Finland", flag: "🇫🇮", url: "https://disk.yandex.ru/d/8hq7xqmndwAYTw" }
          ]
        },
        southAmerica: {
          title: "South America",
          countries: [{ name: "Dominican Republic", flag: "🇩🇴", url: "" }]
        },
        northAmerica: {
          title: "North America",
          countries: [{ name: "United States", flag: "🇺🇸", url: "" }]
        },
        africa: {
          title: "Africa & Gulf",
          countries: [{ name: "UAE / Dubai", flag: "🇦🇪", url: "" }]
        },
        asia: {
          title: "Asia & Oceania",
          countries: [{ name: "Thailand", flag: "🇹🇭", url: "" }]
        }
      };

      function openMenu(regionKey) {
        const region = data[regionKey];
        if (!region) return;

        document.getElementById('modal-title').innerText = region.title;
        const container = document.getElementById('modal-links');
        container.innerHTML = '';

        region.countries.forEach(item => {
          const div = document.createElement('div');
          div.className = 'country-btn';
          div.onclick = () => loadGallery(item.name, item.url);
          
          let flagMarkup = item.icon 
            ? `<img src="${item.icon}">` 
            : `<span style="font-size:1.2rem;">${item.flag || '📍'}</span>`;

          div.innerHTML = `
            <div class="left-box">
              ${flagMarkup}
              <span>${item.name}</span>
            </div>
            <span style="color:#FFD700; font-size:13px;">Смотреть ➔</span>
          `;
          container.appendChild(div);
        });

        document.getElementById('modal-overlay').style.display = 'block';
        document.getElementById('modal').style.display = 'flex';
      }

      function closeModal() {
        document.getElementById('modal-overlay').style.display = 'none';
        document.getElementById('modal').style.display = 'none';
      }

      let currentPhotos = [];
      let currentIndex = 0;

      async function loadGallery(countryName, diskUrl) {
        if (!diskUrl) {
          alert('Папка с фото ещё не привязана');
          return;
        }

        closeModal();
        const gallery = document.getElementById('gallery-box');
        const status = document.getElementById('g-status');
        const img = document.getElementById('g-image');

        document.getElementById('g-title').innerText = countryName;
        gallery.style.display = 'flex';
        status.style.display = 'block';
        status.innerText = 'Загрузка фото...';
        img.style.display = 'none';
        currentPhotos = [];

        try {
          // Запрашиваем превью высокого разрешения (preview_size=XXL / 1280px)
          const res = await fetch(`https://cloud-api.yandex.net/v1/disk/public/resources?public_key=${encodeURIComponent(diskUrl)}&limit=100&preview_size=XXL&preview_crop=false`);
          const json = await res.json();

          if (json._embedded && json._embedded.items) {
            currentPhotos = json._embedded.items
              .filter(f => f.mime_type && f.mime_type.startsWith('image/'))
              .map(f => {
                // Если есть готовый превью-URL без авторизации — берем его, иначе прямую ссылку
                return f.sizes && f.sizes.length > 0 
                  ? f.sizes[f.sizes.length - 1].url 
                  : (f.preview || f.file);
              });
          }

          if (currentPhotos.length > 0) {
            currentIndex = 0;
            showPhoto(0);
          } else {
            status.innerText = 'В этой папке нет фото';
          }
        } catch (err) {
          status.innerText = 'Ошибка загрузки файлов';
        }
      }

      function showPhoto(idx) {
        const img = document.getElementById('g-image');
        const status = document.getElementById('g-status');
        const count = document.getElementById('g-count');

        status.style.display = 'none';
        img.style.display = 'block';
        img.crossOrigin = "anonymous";
        img.src = currentPhotos[idx];
        count.innerText = `${idx + 1} / ${currentPhotos.length}`;
      }

      function nextPhoto() {
        if (currentPhotos.length <= 1) return;
        currentIndex = (currentIndex + 1) % currentPhotos.length;
        showPhoto(currentIndex);
      }

      function prevPhoto() {
        if (currentPhotos.length <= 1) return;
        currentIndex = (currentIndex - 1 + currentPhotos.length) % currentPhotos.length;
        showPhoto(currentIndex);
      }

      function closeGallery() {
        document.getElementById('gallery-box').style.display = 'none';
      }
    </script>
