<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Travel Map AR</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      
      /* Верхняя подсказка */
      #hint {
        position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.85); color: #fff; padding: 10px 20px;
        border-radius: 20px; font-size: 13px; z-index: 10; pointer-events: none;
        border: 1px solid rgba(255, 215, 0, 0.4); text-align: center;
      }

      /* Всплывающее меню стран */
      #modal {
        display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 215, 0, 0.5); border-radius: 16px;
        padding: 20px; width: 80%; max-width: 320px; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      }
      #modal h3 { margin: 0 0 14px 0; color: #FFD700; font-size: 18px; text-align: center; }
      .country-btn {
        display: block; width: 100%; padding: 10px 14px; margin-bottom: 8px; box-sizing: border-box;
        background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255,255,255,0.15);
        border-radius: 10px; font-size: 14px; text-decoration: none; text-align: left; transition: 0.2s;
      }
      .country-btn:active { background: rgba(255, 215, 0, 0.3); border-color: #FFD700; }
      .close-btn {
        display: block; width: 100%; margin-top: 12px; padding: 8px; background: transparent;
        color: #aaa; border: none; font-size: 13px; text-align: center; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="hint">✨ Point camera at a continent and tap the button</div>

    <!-- Всплывающее окно со странами -->
    <div id="modal">
      <h3 id="modal-title">Select Country</h3>
      <div id="modal-links"></div>
      <button class="close-btn" onclick="closeModal()">Close ✕</button>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 2;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <canvas id="btn-europe" width="640" height="160"></canvas>
        <canvas id="btn-caribbean" width="640" height="160"></canvas>
        <canvas id="btn-north-america" width="640" height="160"></canvas>
        <canvas id="btn-africa" width="640" height="160"></canvas>
        <canvas id="btn-asia" width="640" height="160"></canvas>
      </a-assets>
      
      <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 10000; objects: .clickable"></a-camera>

      <!-- ========================================== -->
      <!-- ФОТО 2 (targetIndex: 1): EUROPE            -->
      <!-- ========================================== -->
      <a-entity mindar-image-target="targetIndex: 1">
        <a-plane class="clickable" position="-0.15 -0.06 0.01" width="0.32" height="0.08" material="src: #btn-europe; transparent: true;"
                 onclick="openMenu('europe')"></a-plane>
      </a-entity>

      <!-- ========================================== -->
      <!-- ФОТО 3 (targetIndex: 2): NORTH AMERICA     -->
      <!-- ========================================== -->
      <a-entity mindar-image-target="targetIndex: 2">
        <a-plane class="clickable" position="0.0 0.0 0.01" width="0.34" height="0.085" material="src: #btn-north-america; transparent: true;"
                 onclick="openMenu('northAmerica')"></a-plane>
      </a-entity>

      <!-- ========================================== -->
      <!-- ФОТО 4 (targetIndex: 3): CARIBBEAN         -->
      <!-- ========================================== -->
      <a-entity mindar-image-target="targetIndex: 3">
        <a-plane class="clickable" position="0.0 0.05 0.01" width="0.34" height="0.085" material="src: #btn-caribbean; transparent: true;"
                 onclick="openMenu('caribbean')"></a-plane>
      </a-entity>

      <!-- ========================================== -->
      <!-- ФОТО 5 (targetIndex: 4): AFRICA & GULF     -->
      <!-- ========================================== -->
      <a-entity mindar-image-target="targetIndex: 4">
        <a-plane class="clickable" position="0.0 0.0 0.01" width="0.34" height="0.085" material="src: #btn-africa; transparent: true;"
                 onclick="openMenu('africa')"></a-plane>
      </a-entity>

      <!-- ========================================== -->
      <!-- ФОТО 6 (targetIndex: 5): ASIA & OCEANIA    -->
      <!-- ========================================== -->
      <a-entity mindar-image-target="targetIndex: 5">
        <a-plane class="clickable" position="0.0 0.0 0.01" width="0.34" height="0.085" material="src: #btn-asia; transparent: true;"
                 onclick="openMenu('asia')"></a-plane>
      </a-entity>

    </a-scene>

    <script>
      // Генерация плашек с расширенными полями
      function drawButton(canvasId, text) {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        
        ctx.fillStyle = "rgba(15, 15, 15, 0.92)";
        ctx.roundRect(10, 10, 620, 140, 30);
        ctx.fill();

        ctx.lineWidth = 6;
        ctx.strokeStyle = "#FFD700";
        ctx.stroke();

        ctx.fillStyle = "#FFFFFF";
        ctx.font = "bold 40px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(text, 320, 80);
      }

      drawButton('btn-europe', '🇪🇺 Europe');
      drawButton('btn-caribbean', '🏝️ Caribbean');
      drawButton('btn-north-america', '🗽 North America');
      drawButton('btn-africa', '🌍 Africa & Gulf');
      drawButton('btn-asia', '⛩️ Asia & Oceania');

      const data = {
        europe: {
          title: "🇪🇺 Europe Travels",
          countries: [
            { name: "🇮🇹 Italy", url: "https://disk.yandex.ru/d/ССЫЛКА_ИТАЛИЯ" },
            { name: "🏝️ Sardinia", url: "https://disk.yandex.ru/d/ССЫЛКА_САРДИНИЯ" },
            { name: "🇭🇷 Croatia", url: "https://disk.yandex.ru/d/ССЫЛКА_ХОРВАТИЯ" },
            { name: "🇪🇸 Spain", url: "https://disk.yandex.ru/d/ССЫЛКА_ИСПАНИЯ" },
            { name: "🇵🇹 Portugal", url: "https://disk.yandex.ru/d/ССЫЛКА_ПОРТУГАЛИЯ" },
            { name: "🇩🇪 Germany", url: "https://disk.yandex.ru/d/ССЫЛКА_ГЕРМАНИЯ" },
            { name: "🇵🇱 Poland", url: "https://disk.yandex.ru/d/ССЫЛКА_ПОЛЬША" },
            { name: "🇩🇰 Denmark", url: "https://disk.yandex.ru/d/ССЫЛКА_ДАНИЯ" },
            { name: "🇸🇪 Sweden", url: "https://disk.yandex.ru/d/ССЫЛКА_ШВЕЦИЯ" },
            { name: "🇫🇮 Finland", url: "https://disk.yandex.ru/d/ССЫЛКА_ФИНЛЯНДИЯ" }
          ]
        },
        caribbean: {
          title: "🏝️ Caribbean",
          countries: [
            { name: "🇩🇴 Dominican Republic", url: "https://disk.yandex.ru/d/ССЫЛКА_ДОМИНИКАНА" }
          ]
        },
        northAmerica: {
          title: "🗽 North America",
          countries: [
            { name: "🇺🇸 United States", url: "https://disk.yandex.ru/d/ССЫЛКА_США" }
          ]
        },
        africa: {
          title: "🌍 Africa & Gulf",
          countries: [
            { name: "🇦🇪 UAE / Dubai", url: "https://disk.yandex.ru/d/ССЫЛКА_ОАЭ" }
          ]
        },
        asia: {
          title: "⛩️ Asia & Oceania",
          countries: [
            { name: "🇹🇭 Thailand", url: "https://disk.yandex.ru/d/ССЫЛКА_ТАИЛАНД" }
          ]
        }
      };

      function openMenu(regionKey) {
        const region = data[regionKey];
        if (!region) return;

        document.getElementById('modal-title').innerText = region.title;
        const container = document.getElementById('modal-links');
        container.innerHTML = '';

        region.countries.forEach(item => {
          const a = document.createElement('a');
          a.className = 'country-btn';
          a.innerText = item.name;
          a.href = item.url;
          a.target = '_blank';
          container.appendChild(a);
        });

        document.getElementById('modal').style.display = 'block';
      }

      function closeModal() {
        document.getElementById('modal').style.display = 'none';
      }
    </script>
  </body>
</html>
