<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta charset="utf-8" />
    <title>Travel Map AR</title>

    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0d0e12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Travel Map">
    <link rel="apple-touch-icon" href="./icon.png">

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body { margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #000; }
      
      #hint {
        position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
        background: rgba(18, 20, 29, 0.85); color: #fff; padding: 10px 22px;
        border-radius: 30px; font-size: 13px; font-weight: 500; z-index: 10; pointer-events: none;
        border: 1px solid rgba(255, 215, 0, 0.4); text-align: center; white-space: nowrap;
      }

      #modal-overlay {
        display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        z-index: 999;
      }

      #modal {
        display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: rgba(24, 26, 36, 0.95);
        border: 1px solid rgba(255, 215, 0, 0.4); border-radius: 20px;
        padding: 20px; width: 88%; max-width: 340px; max-height: 80vh;
        z-index: 1000; box-shadow: 0 15px 40px rgba(0,0,0,0.8);
        flex-direction: column;
      }

      #modal h3 {
        margin: 0 0 14px 0; font-size: 19px; font-weight: 700; text-align: center; color: #FFD700;
      }

      #modal-links {
        overflow-y: auto; display: flex; flex-direction: column; gap: 8px; max-height: 55vh;
      }

      .country-btn {
        display: flex; align-items: center; justify-content: space-between;
        padding: 12px 14px; background: rgba(255, 255, 255, 0.07); color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px;
        font-size: 15px; cursor: pointer; user-select: none;
      }
      .country-btn:active { background: rgba(255, 215, 0, 0.25); border-color: #FFD700; }
      .country-btn .left-box { display: flex; align-items: center; gap: 10px; }
      .country-btn img { width: 22px; height: 15px; object-fit: cover; border-radius: 2px; }

      .close-btn {
        margin-top: 14px; padding: 10px; background: rgba(255, 255, 255, 0.1);
        color: #ddd; border: none; border-radius: 10px; font-size: 14px; cursor: pointer;
      }

      /* Окно фотогалереи */
      #gallery-box {
        display: none; position: fixed; inset: 0; z-index: 2000;
        background: #050505; flex-direction: column; justify-content: space-between;
        align-items: center; padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 30px);
      }
      .g-header {
        width: 100%; display: flex; justify-content: space-between; align-items: center;
        color: #fff; font-size: 16px; font-weight: 600; padding: 10px 0;
      }
      .g-close {
        background: rgba(255,255,255,0.2); border: none; color: #fff;
        font-size: 16px; width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
      }
      .g-body {
        flex: 1; width: 100%; display: flex; justify-content: center; align-items: center; position: relative;
      }
      #g-image {
        max-width: 100%; max-height: 70vh; object-fit: contain; border-radius: 8px;
      }
      .g-nav {
        position: absolute; top: 50%; transform: translateY(-50%);
        background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2);
        color: #FFD700; font-size: 26px; width: 44px; height: 44px; border-radius: 50%;
        display: flex; justify-content: center; align-items: center; cursor: pointer;
      }
      .g-prev { left: 5px; }
      .g-next { right: 5px; }
      #g-status { color: #FFD700; font-size: 15px; position: absolute; text-align: center; }
    </style>
  </head>
  <body>
    <div id="hint">Наведите камеру на карту и коснитесь метки</div>

    <div id="modal-overlay" onclick="closeModal()"></div>

    <div id="modal">
      <h3 id="modal-title">Страны</h3>
      <div id="modal-links"></div>
      <button class="close-btn" onclick="closeModal()">Закрыть</button>
    </div>

    <div id="gallery-box">
      <div class="g-header">
        <span id="g-title">Страна</span>
        <span id="g-count" style="color:#FFD700;">1 / 1</span>
        <button class="g-close" onclick="closeGallery()">✕</button>
      </div>
      <div class="g-body">
        <div id="g-status">Загрузка фото...</div>
        <img id="g-image" src="" style="display:none;" />
        <div class="g-nav g-prev" onclick="prevPhoto()">‹</div>
        <div class="g-nav g-next" onclick="nextPhoto()">›</div>
      </div>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 2;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <canvas id="btn-europe" width="600" height="170"></canvas>
        <canvas id="btn-north-america" width="760" height="170"></canvas>
        <canvas id="btn-south-america" width="760" height="170"></canvas>
        <canvas id="btn-africa" width="700" height="170"></canvas>
        <canvas id="btn-asia" width="780" height="170"></canvas>
      </a-assets>
      
      <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 10000; objects: .clickable"></a-camera>

      <a-entity mindar-image-target="targetIndex: 1">
        <a-plane class="clickable" position="-0.15 -0.06 0.01" width="0.26" height="0.075" material="src: #btn-europe; transparent: true;" onclick="openMenu('europe')"></a-plane>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 2">
        <a-plane class="clickable" position="0.0 0.0 0.01" width="0.33" height="0.075" material="src: #btn-north-america; transparent: true;" onclick="openMenu('northAmerica')"></a-plane>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 3">
        <a-plane class="clickable" position="0.0 0.05 0.01" width="0.33" height="0.075" material="src: #btn-south-america; transparent: true;" onclick="openMenu('southAmerica')"></a-plane>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 4">
        <a-plane class="clickable" position="0.0 0.0 0.01" width="0.30" height="0.075" material="src: #btn-africa; transparent: true;" onclick="openMenu('africa')"></a-plane>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 5">
        <a-plane class="clickable" position="0.0 0.0 0.01" width="0.34" height="0.075" material="src: #btn-asia; transparent: true;" onclick="openMenu('asia')"></a-plane>
      </a-entity>
    </a-scene>

    <script>
      function drawButton(canvasId, title, width) {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, width, 170);
        ctx.fillStyle = "rgba(18, 20, 29, 0.95)";
        ctx.roundRect(10, 10, width - 20, 150, 28);
        ctx.fill();
        ctx.lineWidth = 5;
        ctx.strokeStyle = "#FFD700";
        ctx.stroke();
        ctx.fillStyle = "#FFFFFF";
        ctx.font = "bold 44px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(title + " ➔", width / 2, 85);
      }

      window.addEventListener('load', () => {
        drawButton('btn-europe', 'Europe', 600);
        drawButton('btn-north-america', 'North America', 760);
        drawButton('btn-south-america', 'South America', 760);
        drawButton('btn-africa', 'Africa & Gulf', 700);
        drawButton('btn-asia', 'Asia & Oceania', 780);
      });

      const data = {
        europe: {
          title: "Europe",
          countries: [
            { name: "Italy", flag: "🇮🇹", url: "https://disk.yandex.ru/d/85Pdg0fvxir31A" },
            { name: "Sardinia", icon: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Flag_of_Sardinia.svg/60px-Flag_of_Sardinia.svg.png", url: "https://disk.yandex.ru/d/i8U8ojtllbuH4g" },
            { name: "Croatia", flag: "🇭🇷", url: "https://disk.yandex.ru/d/sIWYC7LTMAIDPw" },
            { name: "Spain", flag: "🇪🇸", url: "https://disk.yandex.ru/d/GKAKTY1uNk6ARA" },
            { name: "Portugal", flag: "🇵🇹", url: "https://disk.yandex.ru/d/CDl2SXTKuhkx-Q" },
            { name: "Germany", flag: "🇩🇪", url: "https://disk.yandex.ru/d/krPEvjvqsnLr3g" },
            { name: "Poland", flag: "🇵🇱", url: "https://disk.yandex.ru/d/ph81vLLacGXnUQ" },
            { name: "Denmark", flag: "🇩🇰", url: "https://disk.yandex.ru/d/J5T9HQRTQMF-aw" },
            { name: "Sweden", flag: "🇸🇪", url: "https://disk.yandex.ru/d/iHJKhJQKxd97Ew" },
            { name: "Finland", flag: "🇫🇮", url: "https://disk.yandex.ru/d/8hq7xqmndwAYTw" }
          ]
        },
        southAmerica: {
          title: "South America",
          countries: [{ name: "Dominican Republic", flag: "🇩🇴", url: "" }]
        },
        northAmerica: {
          title: "North America",
          countries: [{ name: "United States", flag: "🇺🇸", url: "" }]
        },
        africa: {
          title: "Africa & Gulf",
          countries: [{ name: "UAE / Dubai", flag: "🇦🇪", url: "" }]
        },
        asia: {
          title: "Asia & Oceania",
          countries: [{ name: "Thailand", flag: "🇹🇭", url: "" }]
        }
      };

      function openMenu(regionKey) {
        const region = data[regionKey];
        if (!region) return;

        document.getElementById('modal-title').innerText = region.title;
        const container = document.getElementById('modal-links');
        container.innerHTML = '';

        region.countries.forEach(item => {
          const div = document.createElement('div');
          div.className = 'country-btn';
          div.onclick = () => loadGallery(item.name, item.url);
          
          let flagMarkup = item.icon 
            ? `<img src="${item.icon}">` 
            : `<span style="font-size:1.2rem;">${item.flag || '📍'}</span>`;

          div.innerHTML = `
            <div class="left-box">
              ${flagMarkup}
              <span>${item.name}</span>
            </div>
            <span style="color:#FFD700; font-size:13px;">Смотреть ➔</span>
          `;
          container.appendChild(div);
        });

        document.getElementById('modal-overlay').style.display = 'block';
        document.getElementById('modal').style.display = 'flex';
      }

      function closeModal() {
        document.getElementById('modal-overlay').style.display = 'none';
        document.getElementById('modal').style.display = 'none';
      }

      let currentPhotos = [];
      let currentIndex = 0;

      async function loadGallery(countryName, diskUrl) {
        if (!diskUrl) {
          alert('Папка с фото ещё не привязана');
          return;
        }

        closeModal();
        const gallery = document.getElementById('gallery-box');
        const status = document.getElementById('g-status');
        const img = document.getElementById('g-image');

        document.getElementById('g-title').innerText = countryName;
        gallery.style.display = 'flex';
        status.style.display = 'block';
        status.innerText = 'Загрузка фото...';
        img.style.display = 'none';
        currentPhotos = [];

        try {
          const res = await fetch(`https://cloud-api.yandex.net/v1/disk/public/resources?public_key=${encodeURIComponent(diskUrl)}&limit=100`);
          const json = await res.json();

          if (json._embedded && json._embedded.items) {
            currentPhotos = json._embedded.items
              .filter(f => f.mime_type && f.mime_type.startsWith('image/'))
              .map(f => f.file);
          }

          if (currentPhotos.length > 0) {
            currentIndex = 0;
            showPhoto(0);
          } else {
            status.innerText = 'В этой папке нет фото';
          }
        } catch (err) {
          status.innerText = 'Ошибка загрузки файлов';
        }
      }

      function showPhoto(idx) {
        const img = document.getElementById('g-image');
        const status = document.getElementById('g-status');
        const count = document.getElementById('g-count');

        status.style.display = 'none';
        img.style.display = 'block';
        img.src = currentPhotos[idx];
        count.innerText = `${idx + 1} / ${currentPhotos.length}`;
      }

      function nextPhoto() {
        if (currentPhotos.length <= 1) return;
        currentIndex = (currentIndex + 1) % currentPhotos.length;
        showPhoto(currentIndex);
      }

      function prevPhoto() {
        if (currentPhotos.length <= 1) return;
        currentIndex = (currentIndex - 1 + currentPhotos.length) % currentPhotos.length;
        showPhoto(currentIndex);
      }

      function closeGallery() {
        document.getElementById('gallery-box').style.display = 'none';
      }
    </script>
  </body>
</html>
