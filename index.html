<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Карта Путешествий AR</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #hint {
        position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.8); color: #fff; padding: 10px 20px;
        border-radius: 24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px; letter-spacing: 0.5px; z-index: 999; pointer-events: none;
        border: 1px solid rgba(255, 215, 0, 0.4); text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="hint">✨ Нажмите на светящуюся точку страны для открытия фото</div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 10000; objects: .clickable"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        
        <!-- 1. ИТАЛИЯ -->
        <a-circle class="clickable" 
                  position="0.038 0.088 0.01" 
                  radius="0.015" 
                  color="#FFD700" 
                  opacity="0.9"
                  onclick="window.open('https://disk.yandex.ru/d/ССЫЛКА_ИТАЛИЯ', '_blank')">
        </a-circle>

        <!-- 2. ОСТРОВ САРДИНИЯ -->
        <a-circle class="clickable" 
                  position="0.024 0.076 0.01" 
                  radius="0.010" 
                  color="#FFD700" 
                  opacity="0.9"
                  onclick="window.open('https://disk.yandex.ru/d/ССЫЛКА_САРДИНИЯ', '_blank')">
        </a-circle>

        <!-- 3. ХОРВАТИЯ -->
        <a-circle class="clickable" 
                  position="0.048 0.098 0.01" 
                  radius="0.013" 
                  color="#FFD700" 
                  opacity="0.9"
                  onclick="window.open('https://disk.yandex.ru/d/ССЫЛКА_ХОРВАТИЯ', '_blank')">
        </a-circle>

        <!-- 4. ИСПАНИЯ -->
        <a-circle class="clickable" 
                  position="-0.012 0.078 0.01" 
                  radius="0.018" 
                  color="#FFD700" 
                  opacity="0.9"
                  onclick="window.open('https://disk.yandex.ru/d/ССЫЛКА_ИСПАНИЯ', '_blank')">
        </a-circle>

        <!-- 5. ПОРТУГАЛИЯ -->
        <a-circle class="clickable" 
                  position="-0.028 0.076 0.01" 
                  radius="0.012" 
                  color="#FFD700" 
                  opacity="0.9"
                  onclick="window.open('https://disk.yandex.ru/d/ССЫЛКА_ПОРТУГАЛИЯ', '_blank')">
        </a-circle>

        <!-- 6. ГЕРМАНИЯ -->
        <a-circle class="clickable" 
                  position="0.028 0.128 0.01" 
                  radius="0.017" 
                  color="#FFD700" 
                  opacity="0.9"
                  onclick="window.open('https://disk.yandex.ru/d/ССЫЛКА_ГЕРМАНИЯ', '_blank')">
        </a-circle>

        <!-- 7. ПОЛЬША -->
        <a-circle class="clickable" 
                  position="0.054 0.130 0.01" 
                  radius="0.017" 
                  color="#FFD700" 
                  opacity="0.9"
                  onclick="window.open('https://disk.yandex.ru/d/ССЫЛКА_ПОЛЬША', '_blank')">
        </a-circle>

        <!-- 8. ДАНИЯ -->
        <a-circle class="clickable" 
                  position="0.027 0.148 0.01" 
                  radius="0.012" 
                  color="#FFD700" 
                  opacity="0.9"
                  onclick="window.open('https://disk.yandex.ru/d/ССЫЛКА_ДАНИЯ', '_blank')">
        </a-circle>

        <!-- 9. ШВЕЦИЯ -->
        <a-circle class="clickable" 
                  position="0.041 0.178 0.01" 
                  radius="0.018" 
                  color="#FFD700" 
                  opacity="0.9"
                  onclick="window.open('https://disk.yandex.ru/d/ССЫЛКА_ШВЕЦИЯ', '_blank')">
        </a-circle>

        <!-- 10. ФИНЛЯНДИЯ -->
        <a-circle class="clickable" 
                  position="0.065 0.186 0.01" 
                  radius="0.018" 
                  color="#FFD700" 
                  opacity="0.9"
                  onclick="window.open('https://disk.yandex.ru/d/ССЫЛКА_ФИНЛЯНДИЯ', '_blank')">
        </a-circle>

        <!-- 11. ДОМИНИКАНСКАЯ РЕСПУБЛИКА (Карибы) -->
        <a-circle class="clickable" 
                  position="-0.228 0.040 0.01" 
                  radius="0.012" 
                  color="#FFD700" 
                  opacity="0.9"
                  onclick="window.open('https://disk.yandex.ru/d/ССЫЛКА_ДОМИНИКАНА', '_blank')">
        </a-circle>

      </a-entity>
    </a-scene>
  </body>
</html>
