<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Карта Путешествий AR</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      
      /* Верхняя подсказка */
      #hint {
        position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.85); color: #fff; padding: 10px 20px;
        border-radius: 20px; font-size: 13px; z-index: 10; pointer-events: none;
        border: 1px solid rgba(255, 215, 0, 0.4); text-align: center;
      }

      /* Всплывающее меню стран */
      #modal {
        display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 215, 0, 0.5); border-radius: 16px;
        padding: 20px; width: 80%; max-width: 320px; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      }
      #modal h3 { margin: 0 0 14px 0; color: #FFD700; font-size: 18px; text-align: center; }
      .country-btn {
        display: block; width: 100%; padding: 10px 14px; margin-bottom: 8px; box-sizing: border-box;
        background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255,255,255,0.15);
        border-radius: 10px; font-size: 14px; text-decoration: none; text-align: left; transition: 0.2s;
      }
      .country-btn:active { background: rgba(255, 215, 0, 0.3); border-color: #FFD700; }
      .close-btn {
        display: block; width: 100%; margin-top: 12px; padding: 8px; background: transparent;
        color: #aaa; border: none; font-size: 13px; text-align: center; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="hint">✨ Наведите камеру на материк и нажмите на маркер</div>

    <!-- Всплывающее окно со странами -->
    <div id="modal">
      <h3 id="modal-title">Выберите страну</h3>
      <div id="modal-links"></div>
      <button class="close-btn" onclick="closeModal()">Закрыть ✕</button>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 2;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 10000; objects: .clickable"></a-camera>

      <!-- ========================================== -->
      <!-- ФОТО 2 (targetIndex: 1): ЕВРОПА            -->
      <!-- ========================================== -->
      <a-entity mindar-image-target="targetIndex: 1">
        <!-- Крупная плашка Европа в центре кадра -->
        <a-plane class="clickable" position="-0.15 -0.10 0.01" width="0.28" height="0.08" color="#111111" opacity="0.9"
                 onclick="openMenu('europe')">
          <a-text value="🌍 Страны Европы" align="center" color="#FFD700" width="1.2"></a-text>
        </a-plane>
      </a-entity>

      <!-- ========================================== -->
      <!-- ФОТО 4 (targetIndex: 3): КАРИБЫ            -->
      <!-- ========================================== -->
      <a-entity mindar-image-target="targetIndex: 3">
        <!-- Крупная плашка Карибы -->
        <a-plane class="clickable" position="0.0 0.0 0.01" width="0.32" height="0.08" color="#111111" opacity="0.9"
                 onclick="openMenu('caribbean')">
          <a-text value="🏝️ Карибы" align="center" color="#FFD700" width="1.2"></a-text>
        </a-plane>
      </a-entity>

    </a-scene>

    <script>
      // Ссылки на ваши фотоальбомы по регионам
      const data = {
        europe: {
          title: "🌍 Путешествия по Европе",
          countries: [
            { name: "🇮🇹 Италия", url: "https://disk.yandex.ru/d/ССЫЛКА_ИТАЛИЯ" },
            { name: "🏝️ Остров Сардиния", url: "https://disk.yandex.ru/d/ССЫЛКА_САРДИНИЯ" },
            { name: "🇭🇷 Хорватия", url: "https://disk.yandex.ru/d/ССЫЛКА_ХОРВАТИЯ" },
            { name: "🇪🇸 Испания", url: "https://disk.yandex.ru/d/ССЫЛКА_ИСПАНИЯ" },
            { name: "🇵🇹 Португалия", url: "https://disk.yandex.ru/d/ССЫЛКА_ПОРТУГАЛИЯ" },
            { name: "🇩🇪 Германия", url: "https://disk.yandex.ru/d/ССЫЛКА_ГЕРМАНИЯ" },
            { name: "🇵🇱 Польша", url: "https://disk.yandex.ru/d/ССЫЛКА_ПОЛЬША" },
            { name: "🇩🇰 Дания", url: "https://disk.yandex.ru/d/ССЫЛКА_ДАНИЯ" },
            { name: "🇸🇪 Швеция", url: "https://disk.yandex.ru/d/ССЫЛКА_ШВЕЦИЯ" },
            { name: "🇫🇮 Финляндия", url: "https://disk.yandex.ru/d/ССЫЛКА_ФИНЛЯНДИЯ" }
          ]
        },
        caribbean: {
          title: "🏝️ Карибский бассейн",
          countries: [
            { name: "🇩🇴 Доминиканская Республика", url: "https://disk.yandex.ru/d/ССЫЛКА_ДОМИНИКАНА" }
          ]
        }
      };

      function openMenu(regionKey) {
        const region = data[regionKey];
        if (!region) return;

        document.getElementById('modal-title').innerText = region.title;
        const container = document.getElementById('modal-links');
        container.innerHTML = '';

        region.countries.forEach(item => {
          const a = document.createElement('a');
          a.className = 'country-btn';
          a.innerText = item.name;
          a.href = item.url;
          a.target = '_blank';
          container.appendChild(a);
        });

        document.getElementById('modal').style.display = 'block';
      }

      function closeModal() {
        document.getElementById('modal').style.display = 'none';
      }
    </script>
  </body>
</html>
